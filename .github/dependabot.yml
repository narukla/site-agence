# Dependabot : GitHub ouvre tout seul une PR quand une dépendance a une nouvelle version.
# Chaque PR passe par le contrôle « verifier » et une relecture, comme les autres : rien n'est fusionné tout seul.
# Une fois par semaine (lundi matin), groupées en une seule PR par type, pour ne pas noyer l'équipe.
# Règle d'équipe « versions publiées depuis plus de 2 semaines » : cooldown de 14 jours avant de proposer une version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 14
    groups:
      dependances:
        patterns: ['*']
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'deps'

  # Actions GitHub utilisées par .github/workflows (checkout, setup-node)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
